# Grid Search Configuration for Safety-Lookahead on AgentHarm (harmful + benign)
# Modes: disabled, prompt-v2 baseline, and SALT v4 lookahead
# Models: deepseek-v3.2, minimax-m2.5, kimi-k2.5, glm-5, qwen3.5-397-a17b
#
# Usage:
#   ./run-eval-salt.py --grid --config configs/grid-search-safety-lookahead-disabled-prompt-v2-v4-agentharm-harmful-benign-5models.yaml

benchmarks:
  - "agentharm"
  - "agentharm:agentharm_benign"

run_name: "safety-lookahead-disabled-prompt-v2-v4-agentharm-harmful-benign-5models-r1"

model:
  models:
    - "alicloud-deepseek-v3.2"
    - "alicloud-minimax-m2.5"
    - "azure-kimi-k2.5"
    - "alicloud-glm-5"
    - "alicloud-qwen3.5-397b-a17b"
  base_url: null

grid_search:
  parallel: false
  workers: 1
  fail_fast: false

  dimensions:
    safety_lookahead:
      enabled: [false, true]
      version: ["prompt-v2", "v4"]

task:
  limit: "400"
  sample_id: ""
  sample_shuffle: ""
  epochs: 1

# ------------------------------------------------------------------------------
# Task Limits
# ------------------------------------------------------------------------------
limits:
  message: "100"             # Total messages limit per sample
  token: ""                 # Total tokens limit per sample
  time: ""                  # Total running time limit per sample (seconds)
  working: ""               # Working time limit (model gen, tools, etc.)

concurrency:
  max_samples: ""
  max_tasks: ""
  max_subprocesses: ""
  max_sandboxes: "128"
  max_connections: "64"
  max_retries: ""
  timeout: "300"
  attempt_timeout: ""

error_handling:
  fail_on_error: ""         # Keep unset; use INSPECT_EVAL_NO_FAIL_ON_ERROR below
  continue_on_fail: "true"  # Continue run even if error threshold is reached
  retry_on_error: "1"       # Retry transient provider failures once
  debug_errors: "false"

env:
  variables:
    - "INSPECT_EVAL_NO_FAIL_ON_ERROR=1"
