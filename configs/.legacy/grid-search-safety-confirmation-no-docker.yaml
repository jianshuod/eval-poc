# Grid Search Configuration for Safety-Confirmation Evaluation (No Docker/K8s required)
# This config includes only benchmarks that don't require Docker or Kubernetes
#
# Benchmarks:
#   - bfcl: Berkeley Function Calling Leaderboard (no special requirements)
#   - xstest: Exaggerated Safety Behaviors Test (requires HF_TOKEN)

# ==============================================================================
# Base Configuration
# ==============================================================================

benchmarks:
  - "bfcl"               # Berkeley Function Calling Leaderboard
  - "xstest"             # Exaggerated Safety Behaviors Test (requires HF_TOKEN)

# Run name for organizing results
run_name: "safety-confirmation-no-docker-0227-doubao-2-0-pro"

# ==============================================================================
# Model Configuration
# ==============================================================================

model:
  base: "doubao-seed-2-0-pro"
  base_url: null

# ==============================================================================
# Grid Search Dimensions
# ==============================================================================

grid_search:
  parallel: false
  workers: 4
  fail_fast: false

  dimensions:
    safety_confirmation:
      enabled: [false, true]
      version: ["v4"]
      max_reconsideration: [3]

# ------------------------------------------------------------------------------
# Task Execution Parameters
# ------------------------------------------------------------------------------
task:
  limit: ""
  sample_id: ""
  sample_shuffle: ""
  epochs: 1
  epochs_reducer: ""
  solver: ""
  solver_args: []
  solver_config: ""
  task_args: []
  task_config: ""

# ------------------------------------------------------------------------------
# Model Generation Parameters
# ------------------------------------------------------------------------------
generation:
  temperature: ""
  top_p: ""
  top_k: ""
  max_tokens: ""
  stop_seqs: ""
  frequency_penalty: ""
  presence_penalty: ""
  num_choices: ""
  best_of: ""
  seed: ""
  logprobs: ""
  top_logprobs: ""
  logit_bias: ""
  system_message: ""
  reasoning_effort: ""
  reasoning_tokens: ""
  reasoning_summary: ""
  reasoning_history: ""
  effort: ""
  cache_prompt: ""
  verbosity: ""
  response_schema: ""

# ------------------------------------------------------------------------------
# Tool Configuration
# ------------------------------------------------------------------------------
tools:
  parallel_calls: ""
  internal_tools: ""
  max_output: ""
  approval: ""

# ------------------------------------------------------------------------------
# Concurrency and Performance
# ------------------------------------------------------------------------------
concurrency:
  max_samples: ""
  max_tasks: ""
  max_subprocesses: ""
  max_sandboxes: ""
  max_connections: "200"
  max_retries: ""
  timeout: ""
  attempt_timeout: ""

# ------------------------------------------------------------------------------
# Task Limits
# ------------------------------------------------------------------------------
limits:
  message: "40"
  token: ""
  time: ""
  working: ""

# ------------------------------------------------------------------------------
# Caching and Batching
# ------------------------------------------------------------------------------
performance:
  cache: ""
  batch: ""

# ------------------------------------------------------------------------------
# Error Handling
# ------------------------------------------------------------------------------
error_handling:
  fail_on_error: ""
  continue_on_fail: ""
  retry_on_error: "1"
  debug_errors: ""

# ------------------------------------------------------------------------------
# Logging and Output
# ------------------------------------------------------------------------------
logging:
  log_level: ""
  log_level_transcript: ""
  log_format: ""
  log_dir: ""
  log_samples: ""
  log_realtime: ""
  log_images: ""
  log_buffer: ""
  log_shared: ""
  no_score: ""
  no_score_display: ""

# ------------------------------------------------------------------------------
# Sandbox
# ------------------------------------------------------------------------------
sandbox:
  type: ""                # Empty = no sandbox (disable Docker)
  no_cleanup: ""

# ------------------------------------------------------------------------------
# Display Options
# ------------------------------------------------------------------------------
display:
  format: ""
  no_ansi: ""
  traceback_locals: ""

# ------------------------------------------------------------------------------
# Metadata
# ------------------------------------------------------------------------------
metadata:
  tags: "safety-confirmation,no-docker"
  values: []

# ------------------------------------------------------------------------------
# Environment Variables
# ------------------------------------------------------------------------------
env:
  variables: []

# ------------------------------------------------------------------------------
# Debug Options
# ------------------------------------------------------------------------------
debug:
  enabled: ""
  port: ""

# ------------------------------------------------------------------------------
# Run Configuration
# ------------------------------------------------------------------------------
run:
  dry_run: false
  skip_preflight: false
  force_setup: false
