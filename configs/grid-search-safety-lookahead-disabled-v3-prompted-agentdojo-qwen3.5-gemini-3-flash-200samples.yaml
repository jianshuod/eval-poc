# Grid Search Configuration for AgentDojo
# Compare: disabled (no safety), Safety-Lookahead v3, and prompted baseline
# Models: Alibaba Qwen 3.5 and Gemini 3 Flash
#
# Usage:
#   ./run-eval-salt.py --grid --config configs/grid-search-safety-lookahead-disabled-v3-prompted-agentdojo-qwen3.5-gemini-3-flash-200samples.yaml

benchmarks:
  - "agentdojo"

run_name: "safety-lookahead-disabled-v3-prompted-agentdojo-qwen3.5-gemini-3-flash-200samples-r1"

model:
  models:
    - "alicloud-qwen3.5-35b-a3b"
    - "gemini-3-flash-preview"
  base_url: null

grid_search:
  parallel: false
  workers: 1
  fail_fast: false

  dimensions:
    safety_lookahead:
      enabled: [false, true]
      version: ["v3", "prompted"]

task:
  limit: "200"
  sample_id: ""
  sample_shuffle: ""
  epochs: 1

# ------------------------------------------------------------------------------
# Task Limits
# ------------------------------------------------------------------------------
limits:
  message: "50"             # Total messages limit per sample
  token: ""                 # Total tokens limit per sample
  time: ""                  # Total running time limit per sample (seconds)
  working: ""               # Working time limit (model gen, tools, etc.)

concurrency:
  max_samples: ""
  max_tasks: ""
  max_subprocesses: ""
  max_sandboxes: "128"
  max_connections: "200"
  max_retries: ""
  timeout: "300"
  attempt_timeout: ""

error_handling:
  fail_on_error: ""         # Keep unset; use INSPECT_EVAL_NO_FAIL_ON_ERROR below
  continue_on_fail: "true"  # Continue run even if error threshold is reached
  retry_on_error: "1"       # Retry transient provider failures once
  debug_errors: "false"

env:
  variables:
    - "INSPECT_EVAL_NO_FAIL_ON_ERROR=1"
