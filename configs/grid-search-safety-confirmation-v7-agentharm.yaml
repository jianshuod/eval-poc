# Grid Search Configuration for Safety Confirmation V7 Testing
# Tests 4 modes of safety-confirmation v7 across 6 models on agentharm benchmarks
#
# Usage:
#   ./run-eval-salt.py --grid --config configs/grid-search-safety-confirmation-v7-agentharm.yaml --grid-dry-run
#
# Expected output structure:
#   results/experiments/grid_search/{date}/safety-confirmation-v7-agentharm/{benchmark}/{model}/combos/
#   ├── sophnet-glm-4.7/
#   │   └── combos/
#   │       ├── 001-DISABLED/
#   │       ├── 002-CONFIRM-V7-MODE1/
#   │       ├── 003-CONFIRM-V7-MODE2/
#   │       ├── 004-CONFIRM-V7-MODE3/
#   │       └── 005-CONFIRM-V7-MODE4/
#   └── ... (other models)

# ==============================================================================
# Base Configuration
# ==============================================================================

# Agentharm benchmarks (both harmful and benign)
benchmarks:
  - "agentharm"
  - "agentharm:agentharm_benign"

# Run name for organizing results
run_name: "safety-confirmation-v7-0304-agentharm-4modes"

# ==============================================================================
# Model Configuration
# ==============================================================================

model:
  # Multiple models for testing
  models:
    - "zai-glm-4.7"
    - "alicloud-deepseek-v3.2"
    - "gemini-3-flash-preview"
    - "qwen3-235b-a22b-thinking-2507"
    - "alicloud-qwen3.5-35b-a3b"
    - "doubao-seed-2-0-pro"

  # Optional: Custom base URL for model API
  base_url: null

# ==============================================================================
# Grid Search Dimensions
# ==============================================================================

grid_search:
  # Execution options for grid search
  parallel: false            # Run combinations in parallel (default: false/sequential)
  workers: 4                # Number of parallel workers (default: CPU count // 2)
  fail_fast: false          # Stop on first failure (default: false)

  dimensions:
    safety_confirmation:
      # Enable or disable safety confirmation
      # When false, other safety_confirmation parameters are ignored
      enabled: [true]

      # Safety confirmation implementation version
      version: ["v7"]

      # Number of safety_confirmation calls required to unlock
      n_required: [1]

      # Max reconsideration attempts when safety_confirmed=false
      max_reconsideration: [3]

      # Safety reasoning guideline modes (V7 feature - 4 distinct modes)
      # general: Minimal guidance - model freely reasons about safety without structured prompts
      # structured: Three-dimensional framework (risk source, failure mode, real-world harm) - default
      # attacks: Lists 10 common attack/risk categories (prompt injection, harmful content, bias, privacy, etc.)
      # lookahead: Action-focused analysis - explicitly list potential actions and their corresponding risks
      reasoning_guideline: ["general", "structured", "attacks", "lookahead"]

# ------------------------------------------------------------------------------
# Task Execution Parameters
# ------------------------------------------------------------------------------
task:
  limit: ""                 # Sample limit (e.g., "10" or "10-20"). Empty = all
  sample_id: ""           # Specific sample IDs (comma-separated)
  sample_shuffle: ""      # Shuffle samples (empty=false, or seed number)
  epochs: 1               # Number of times to repeat dataset
  time_limit: "1200"      # Time limit per sample in seconds
  message_limit: "50"     # Limit on total messages per sample

concurrency:
  max_samples: ""         # Max samples to run in parallel
  max_tasks: ""           # Max tasks to run in parallel (default: 1)
  max_subprocesses: ""    # Max subprocesses (default: os.cpu_count())
  max_sandboxes: "128"    # Max sandboxes per provider
  max_connections: "200"  # Max concurrent connections to Model API (default: 10)
  max_retries: ""         # Max request retries (default: unlimited)
  timeout: ""             # Request timeout in seconds
  attempt_timeout: ""     # Timeout per attempt
