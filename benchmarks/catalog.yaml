# Benchmark Catalog - 基准测试路由注册表
# 每个 benchmark 使用独立的虚拟环境
#
# Task 路径格式:
#   - 简单任务: inspect_evals/<benchmark>
#   - 指定 task: upstream/inspect_evals/src/inspect_evals/<path>@<task_name>

benchmarks:
  strong_reject:
    source: upstream
    module: inspect_evals/strong_reject
    python: "3.10"
    tasks:
      - name: strong_reject
        path: inspect_evals/strong_reject

  xstest:
    source: upstream
    module: inspect_evals/xstest
    python: "3.10"
    tasks:
      - name: xstest
        path: inspect_evals/xstest

  cyberseceval_2:
    source: upstream
    module: inspect_evals/cyberseceval_2
    python: "3.10"
    judge_model: zai-glm-4.7
    tasks:
      - name: cyse2_interpreter_abuse
        path: upstream/inspect_evals/src/inspect_evals/cyberseceval_2/interpreter_abuse/task.py@cyse2_interpreter_abuse
      - name: cyse2_prompt_injection
        path: upstream/inspect_evals/src/inspect_evals/cyberseceval_2/prompt_injection/task.py@cyse2_prompt_injection
      - name: cyse2_vulnerability_exploit
        path: upstream/inspect_evals/src/inspect_evals/cyberseceval_2/vulnerability_exploit/task.py@cyse2_vulnerability_exploit

  bbq:
    source: upstream
    module: inspect_evals/bbq
    python: "3.10"
    tasks:
      - name: bbq
        path: inspect_evals/bbq

  cve_bench:
    source: upstream
    module: inspect_evals/cve_bench
    python: "3.12"
    extras: [cve_bench]
    tasks:
      - name: cve_bench
        path: inspect_evals/cve_bench
        # Docker 模式支持全部 40 个 CVE
        task_args:
          sandbox_type: docker

  agentdojo:
    source: upstream
    module: inspect_evals/agentdojo
    python: "3.10"
    extras: [agentdojo]
    tasks:
      - name: agentdojo
        path: inspect_evals/agentdojo

  agentharm:
    source: upstream
    module: inspect_evals/agentharm
    python: "3.10"
    tasks:
      - name: agentharm
        path: inspect_evals/agentharm
      - name: agentharm_benign
        path: upstream/inspect_evals/src/inspect_evals/agentharm/agentharm.py@agentharm_benign

  truthfulqa:
    source: upstream
    module: inspect_evals/truthfulqa
    python: "3.10"
    tasks:
      - name: truthfulqa
        path: inspect_evals/truthfulqa

  browse_comp:
    source: upstream
    module: inspect_evals/browse_comp
    python: "3.10"
    tasks:
      - name: browse_comp
        path: inspect_evals/browse_comp
        # Note: Docker sandbox is default in the task itself (DEFAULT_DOCKER_SANDBOX)

  raccoon:
    source: local
    module: benchmarks.local.raccoon
    python: "3.10"
    tasks:
      - name: raccoon
        path: benchmarks/local/raccoon/raccoon.py@raccoon

  overthink:
    source: local
    module: benchmarks.local.overthink
    python: "3.10"
    tasks:
      - name: overthink
        path: benchmarks/local/overthink/overthink.py@overthink
  privacylens:
    source: local
    module: benchmarks/local/pending_bench/privacylens
    python: "3.10"
    judge_model: zai-glm-4.7
    tasks:
      - name: privacylens_probing
        path: benchmarks/local/pending_bench/privacylens/src/privacylens/task.py@privacylens_probing
        task_args:
          level: seed
      - name: privacylens_action
        path: benchmarks/local/pending_bench/privacylens/src/privacylens/task.py@privacylens_action

  gaia:
    source: upstream
    module: inspect_evals/gaia
    python: "3.10"
    tasks:
      - name: gaia
        path: inspect_evals/gaia
      - name: gaia_level1
        path: upstream/inspect_evals/src/inspect_evals/gaia/gaia.py@gaia_level1
      - name: gaia_level2
        path: upstream/inspect_evals/src/inspect_evals/gaia/gaia.py@gaia_level2
      - name: gaia_level3
        path: upstream/inspect_evals/src/inspect_evals/gaia/gaia.py@gaia_level3

  tau2:
    source: upstream
    module: inspect_evals/tau2
    python: "3.10"
    tasks:
      - name: tau2_airline
        path: upstream/inspect_evals/src/inspect_evals/tau2/tau2.py@tau2_airline
      - name: tau2_retail
        path: upstream/inspect_evals/src/inspect_evals/tau2/tau2.py@tau2_retail
      - name: tau2_telecom
        path: upstream/inspect_evals/src/inspect_evals/tau2/tau2.py@tau2_telecom

  agent_bench:
    source: upstream
    module: inspect_evals/agent_bench
    python: "3.10"
    tasks:
      - name: agent_bench_os
        path: upstream/inspect_evals/src/inspect_evals/agent_bench/agent_bench_os.py@agent_bench_os

  bfcl:
    source: upstream
    module: inspect_evals/bfcl
    python: "3.10"
    tasks:
      - name: bfcl
        path: inspect_evals/bfcl

  # BFCL v4 - Berkeley Function Call Leaderboard v4
  # Comprehensive function calling benchmark with single-turn, multi-turn, and agentic tasks
  bfcl_v4:
    source: local
    module: benchmarks.local.bfcl_v4
    python: "3.10"
    tasks:
      # Combined BFCL v4 V3 - Core function calling categories (4,423 test cases, excludes agentic)
      - name: bfcl_v4_v3
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_v3
        description: BFCL v4 V3 - Core function calling (4,423 test cases). Multi-Turn (30%, 800), Live (10%, 1,351), Non-Live (10%, 1,150), Hallucination (10%, 1,122). Excludes agentic tasks.
      # Combined BFCL v4 Single-Turn - All single-turn categories (V1 + V2, 3,641 test cases)
      - name: bfcl_v4_single_turn
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_single_turn
        description: "BFCL v4 Single-Turn - V1 Non-Live + V2 Live + Relevance (3,641 test cases). Non-Live (1,150): simple_python, simple_java, simple_javascript, multiple, parallel, parallel_multiple, irrelevance. Live (2,367): live_simple, live_multiple, live_parallel, live_parallel_multiple, live_relevance, live_irrelevance. Excludes multi-turn and agentic tasks."
      # Combined BFCL v4 (all categories including non-scoring)
      - name: bfcl_v4
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4
        description: Combined BFCL v4 - all categories (single-turn, multi-turn, agentic, format_sensitivity, relevance)

      # 🤖 Agentic (40%, 665 test cases)
      # Web search tasks (200): Multi-hop reasoning with search tools
      - name: bfcl_v4_web_search
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_web_search
        description: Web search tasks - multi-hop reasoning with search tools (200 test cases)
      # Memory tasks (465): KV Store (155), Vector Store (155), Recursive Summary (155)
      - name: bfcl_v4_memory
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_memory
        description: Memory tasks - KV, Vector, Recursive Summary (465 test cases)

      # 🔄 Multi-Turn (30%, 800 test cases)
      # Multi-turn baseline (200)
      - name: bfcl_v4_multi_turn_base
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_multi_turn_base
        description: Multi-turn baseline tasks (200 test cases)
      # Multi-turn missing function (200)
      - name: bfcl_v4_multi_turn_miss_func
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_multi_turn_miss_func
        description: Multi-turn missing function tasks (200 test cases)
      # Multi-turn missing parameter (200)
      - name: bfcl_v4_multi_turn_miss_param
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_multi_turn_miss_param
        description: Multi-turn missing parameter tasks (200 test cases)
      # Multi-turn long context (200)
      - name: bfcl_v4_multi_turn_long_context
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_multi_turn_long_context
        description: Multi-turn long context tasks (200 test cases)

      # 💡 Live (10%, 1,351 test cases)
      # Live simple (258)
      - name: bfcl_v4_live_simple
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_live_simple
        description: Live simple function calling tasks (258 test cases)
      # Live multiple (1053)
      - name: bfcl_v4_live_multiple
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_live_multiple
        description: Live multiple function calling tasks (1053 test cases)
      # Live parallel (16)
      - name: bfcl_v4_live_parallel
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_live_parallel
        description: Live parallel function calling tasks (16 test cases)
      # Live parallel multiple (24)
      - name: bfcl_v4_live_parallel_multiple
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_live_parallel_multiple
        description: Live parallel multiple function calling tasks (24 test cases)

      # 📂 Non-Live (10%, 1,150 test cases)
      # Python simple (400)
      - name: bfcl_v4_simple_python
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_simple_python
        description: Single-turn Python function calling tasks (400 test cases)
      # Java simple (100)
      - name: bfcl_v4_simple_java
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_simple_java
        description: Single-turn Java function calling tasks (100 test cases)
      # JavaScript simple (50)
      - name: bfcl_v4_simple_javascript
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_simple_javascript
        description: Single-turn JavaScript function calling tasks (50 test cases)
      # Multiple (200)
      - name: bfcl_v4_multiple
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_multiple
        description: Multiple function calling tasks (200 test cases)
      # Parallel (200)
      - name: bfcl_v4_parallel
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_parallel
        description: Parallel function calling tasks (200 test cases)
      # Parallel multiple (200)
      - name: bfcl_v4_parallel_multiple
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_parallel_multiple
        description: Parallel multiple function calling tasks (200 test cases)
      # Irrelevance (240)
      - name: bfcl_v4_irrelevance
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_irrelevance
        description: Irrelevance context tasks (240 test cases)

      # 🧐 Hallucination Measurement (10%, 1,122 test cases)
      # Live irrelevance (882)
      - name: bfcl_v4_live_irrelevance
        path: benchmarks/local/bfcl_v4/bfcl_v4.py@bfcl_v4_live_irrelevance
        description: Live irrelevance tasks - hallucination measurement (882 test cases)

  st_webagentbench:
    source: local
    module: benchmarks.local.st_webagentbench
    python: "3.10"
    extras:
      - browsergym==0.7.0
      - gymnasium
      - playwright
    tasks:
      - name: st_webagentbench
        path: benchmarks/local/st_webagentbench/st_webagentbench.py@st_webagentbench
      # Domain-specific tasks
      - name: st_webagentbench_gitlab
        path: benchmarks/local/st_webagentbench/st_webagentbench.py@st_webagentbench
        task_args:
          domain: gitlab
      - name: st_webagentbench_suitecrm
        path: benchmarks/local/st_webagentbench/st_webagentbench.py@st_webagentbench
        task_args:
          domain: suitecrm
      # Tier-specific SuiteCRM tasks
      - name: st_webagentbench_easy
        path: benchmarks/local/st_webagentbench/st_webagentbench.py@st_webagentbench
        task_args:
          tier: easy
      - name: st_webagentbench_medium
        path: benchmarks/local/st_webagentbench/st_webagentbench.py@st_webagentbench
        task_args:
          tier: medium
      - name: st_webagentbench_hard
        path: benchmarks/local/st_webagentbench/st_webagentbench.py@st_webagentbench
        task_args:
          tier: hard

  injecagent:
    source: local
    module: benchmarks.local.injecagent
    python: "3.10"
    tasks:
      - name: injecagent_dh_base
        path: benchmarks/local/injecagent/__init__.py@injecagent_dh_base
      - name: injecagent_dh_enhanced
        path: benchmarks/local/injecagent/__init__.py@injecagent_dh_enhanced
      - name: injecagent_ds_base
        path: benchmarks/local/injecagent/__init__.py@injecagent_ds_base
      - name: injecagent_ds_enhanced
        path: benchmarks/local/injecagent/__init__.py@injecagent_ds_enhanced
      # Combined tasks (default to base setting)
      - name: injecagent
        path: benchmarks/local/injecagent/__init__.py@injecagent
        task_args:
          setting: base
      - name: injecagent_enhanced
        path: benchmarks/local/injecagent/__init__.py@injecagent
        task_args:
          setting: enhanced

  # Toolathlon - The Tool Decathlon: Benchmarking Language Agents
  # 109 diverse, realistic, long-horizon tasks with 600+ tools across real environments
  toolathlon:
    source: local
    module: benchmarks.local.toolathlon
    python: "3.10"
    extras: [toolathlon]
    tasks:
      # Main task (all 109 tasks)
      - name: toolathlon
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon

      # Sample task (one per category for testing)
      - name: toolathlon_sample
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon_sample

      # Service-specific tasks
      - name: toolathlon_canvas
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon_canvas
        description: Canvas LMS operations (8 tasks)

      - name: toolathlon_notion
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon_notion
        description: Notion workspace tasks (4 tasks)

      - name: toolathlon_k8s
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon_k8s
        description: Kubernetes operations (5 tasks)

      - name: toolathlon_git
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon_git
        description: Git repository operations (3 tasks)

      - name: toolathlon_woocommerce
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon_woocommerce
        description: WooCommerce e-commerce (6 tasks)

      - name: toolathlon_research
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon_research
        description: Academic/research tasks (5 tasks)

      - name: toolathlon_financial
        path: benchmarks/local/toolathlon/toolathlon.py@toolathlon_financial
        description: Financial analysis (6 tasks)
